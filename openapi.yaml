openapi: 3.1.0
info:
  title: Bekräftabeslut BFF API
  version: 1.0.0
  description: Bekräftabeslut BFF — API för bekräftelse av beslut på ersättningar

paths:
  /api/regel/bekraftabeslut/{path}:
    get:
      tags: [BekraftabeslutController]
      operationId: getReferensdata
      summary: Hämta referensdata för ett givet alternativtyp
      parameters:
        - name: path
          in: path
          required: true
          description: Typ av referensdata
          schema:
            type: string
            enum: [avslutstyp, beslutstyp, beslutsutfallstyp, yrkandestatus]
      responses:
        "200":
          description: Referensdata hämtad OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Referensdata"
        "404":
          $ref: "#/components/responses/Error"

  /api/regel/bekraftabeslut/handlaggning/{handlaggningId}:
    get:
      tags: [BekraftabeslutController]
      operationId: getBekraftabeslut
      summary: Hämta information som behövs för att utföra bekräftelsen
      parameters:
        - $ref: "#/components/parameters/HandlaggningId"
      responses:
        "200":
          description: Information hämtad OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GetDataResponse"
        "400":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "500":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/Error"

  /api/regel/bekraftabeslut/{handlaggningId}:
    patch:
      tags: [BekraftabeslutController]
      operationId: patchBekraftabeslut
      summary: Bekräfta beslut och uppdatera ersättningar
      parameters:
        - $ref: "#/components/parameters/HandlaggningId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PatchRequest"
      responses:
        "200":
          description: Bekräftelse genomförd OK
        "400":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "500":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/Error"

  /api/uppgiftsbeskrivning:
    get:
      tags: [BekraftabeslutController]
      operationId: getUppgiftsbeskrivning
      summary: Hämta utökad beskrivning av uppgiften
      responses:
        "200":
          description: Beskrivning hämtad OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GetUppgiftsbeskrivningResponse"
        "403":
          $ref: "#/components/responses/Error"
        "500":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/Error"

  /api/regel/bekraftabeslut/done:
    post:
      tags: [BekraftabeslutController]
      operationId: done
      summary: Markera uppgiften som klar
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BekraftabeslutRequest"
      responses:
        "204":
          description: Uppgiften markerad som klar
        "400":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "500":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/Error"

components:
  parameters:
    HandlaggningId:
      name: handlaggningId
      in: path
      required: true
      description: ID för handläggningsärendet
      schema:
        type: string
        format: uuid

  responses:
    Error:
      description: Fel från BFF:en eller från regeltjänsten bakom den
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

  schemas:
    GetDataResponse:
      type: object
      properties:
        handlaggning_id:
          type: string
          format: uuid
        kund:
          $ref: "#/components/schemas/Kund"
        ersattning:
          type: array
          items:
            $ref: "#/components/schemas/Ersattning"
      required:
        - handlaggning_id
        - kund
        - ersattning

    Kund:
      type: object
      properties:
        fornamn:
          type: string
        efternamn:
          type: string
        kon:
          $ref: "#/components/schemas/Kon"
        anstallning:
          $ref: "#/components/schemas/Anstallning"
      required:
        - fornamn
        - efternamn
        - kon
        - anstallning

    Kon:
      type: string
      enum: [MAN, KVINNA]

    Anstallning:
      type: object
      properties:
        organisationsnummer:
          type: string
        organisationsnamn:
          type: string
        arbetstid_procent:
          type: integer
        anstallningsdag:
          type: string
          format: date
        sista_anstallningsdag:
          type: [string, "null"]
          format: date

    Ersattning:
      type: object
      properties:
        ersattning_id:
          type: string
          format: uuid
        ersattningstyp:
          type: string
        omfattning_procent:
          type: integer
        belopp:
          type: integer
        berakningsgrund:
          type: integer
        beslutsutfall:
          $ref: "#/components/schemas/Beslutsutfall"
        avslagsanledning:
          type: [string, "null"]
        from:
          type: string
          format: date
        tom:
          type: string
          format: date
      required:
        - ersattning_id
        - ersattningstyp
        - omfattning_procent
        - belopp
        - berakningsgrund
        - from
        - tom

    Beslutsutfall:
      type: string
      enum: [JA, NEJ, FU]

    PatchRequest:
      type: object
      properties:
        ersattningar:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/UpdateErsattning"
        beslut:
          $ref: "#/components/schemas/Beslut"
      required:
        - ersattningar
        - beslut

    UpdateErsattning:
      type: object
      properties:
        ersattning_id:
          type: string
          format: uuid
        yrkandestatus:
          type: string
      required:
        - ersattning_id
        - yrkandestatus

    Beslut:
      type: object
      properties:
        avslutstyp:
          type: string
        beslutstyp:
          type: string
        beslutsutfall:
          type: string
      required:
        - avslutstyp
        - beslutstyp
        - beslutsutfall

    BekraftabeslutRequest:
      type: object
      properties:
        handlaggningId:
          type: string
      required:
        - handlaggningId

    Referensdata:
      type: object
      properties:
        id:
          type: string
        kod:
          type: string
        namn:
          type: string

    GetUppgiftsbeskrivningResponse:
      type: object
      properties:
        beskrivning:
          type: string
      required:
        - beskrivning

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required:
        - error
